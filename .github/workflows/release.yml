name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (for lld-link)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Add macOS target
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-targets: true
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        # 钉到具体版本而不是 @v6：维护者发布 v6.1.0 时忘了移动 v6 浮动标签，
        # v6 至今还停在 v6.1.0 之前的那个提交上（缺 pnpm v12 支持等改动）
        uses: pnpm/action-setup@v6.1.0
        with:
          # 与本地开发一致：pnpm 10 才会读取 package.json 的 pnpm.onlyBuiltDependencies
          # （pnpm 9 会无视它，把所有依赖的 postinstall 都跑一遍）
          version: 10
          # pnpm store 缓存，按 pnpm-lock.yaml 的哈希做 key
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version from tag
        run: pnpm sync-version ${{ github.ref_name }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 环境无本地证书，使用 ad-hoc 签名覆盖 tauri.conf.json 中的 signingIdentity
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DH-TransShot ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
