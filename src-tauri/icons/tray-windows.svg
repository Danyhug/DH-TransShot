<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Windows / Linux 托盘图标。

    Windows 没有模板图机制，图标要自己保证在亮色和暗色任务栏上都看得清，所以保留
    App 图标的深色圆角底板。与原图标的区别只有留白：底板从占画布的 80% 放大到 96%，
    托盘按 16~24px 渲染时图形才不至于糊成一团。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211f1b"/>
      <stop offset="1" stop-color="#0f0e0c"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="984" height="984" rx="220" fill="url(#bg)"/>
  <rect x="20.5" y="20.5" width="983" height="983" rx="219.5" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
  <g transform="translate(128 128) scale(24)" fill="none" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M3 10V3h7M22 3h7v7M10 29H3v-7" stroke="#eeebe4"/>
    <path d="M29 22v7h-7" stroke="#ff5d3d"/>
    <path d="M10 11h12M16 11v11" stroke="#eeebe4"/>
  </g>
</svg>
